name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck, lint and test
        run: npm run typecheck && npm run lint && npm test
      # Build, then pre-render every route to static HTML (200 on every URL, readable without JS).
      # The script also writes 404.html (app shell for unknown URLs), sitemap.xml and robots.txt.
      - name: Build and pre-render for GitHub Pages
        run: npm run build:static
        env:
          GITHUB_PAGES: 'true'
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
