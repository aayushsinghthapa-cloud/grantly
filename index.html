<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Grantly. One profile, every scholarship explained. Discover, understand, apply for and track scholarships in one place."
    />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0C" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Grantly: Scholarships, finally simple" />
    <meta
      property="og:description"
      content="One profile. Every scholarship, explained. Match scores, application roadmaps, document readiness, a deadline radar and a funding gap meter."
    />
    <meta name="twitter:card" content="summary" />
    <title>Grantly: Scholarships, finally simple</title>
    <script>
      // Apply persisted theme before paint to avoid a flash of the wrong theme.
      try {
        var s = JSON.parse(localStorage.getItem('grantly-ui') || '{}');
        var t = (s.state && s.state.theme) || 'system';
        var dark =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
