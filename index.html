<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GRANTLY, a unified scholarship discovery and management platform: find scholarships you qualify for, understand every rule in plain words, follow a roadmap for each application, and track deadlines, documents and funding in one place."
    />
    <meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0A0C" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="GRANTLY: Unified Scholarship Discovery &amp; Management Platform"
    />
    <meta
      property="og:description"
      content="One profile. Every scholarship, explained. Match scores, application roadmaps, document readiness, a deadline radar and a funding gap meter."
    />
    <meta property="og:image" content="https://aayushsinghthapa-cloud.github.io/grantly/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://aayushsinghthapa-cloud.github.io/grantly/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>GRANTLY: Unified Scholarship Discovery &amp; Management Platform</title>
    <script>
      // Apply persisted theme before paint to avoid a flash of the wrong theme.
      try {
        var s = JSON.parse(localStorage.getItem('grantly-ui') || '{}');
        var t = (s.state && s.state.theme) || 'system';
        var dark =
          t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
